name: opsnexus

services:
  db:
    image: postgres:16-alpine
    container_name: opsnexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opsnexus
      POSTGRES_USER: opsnexus
      POSTGRES_PASSWORD: opsnexus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - opsnexus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsnexus -d opsnexus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: opsnexus_redis
    restart: unless-stopped
    # No published port: nothing outside this compose network consumes Redis
    # yet (prepping for Week 6/7 Celery), and it ships with no auth by
    # default -- a future Celery worker connects via the internal `redis`
    # hostname on the compose network, not a host-published port.
    volumes:
      - opsnexus_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  opsnexus_pgdata:
  opsnexus_redisdata:
